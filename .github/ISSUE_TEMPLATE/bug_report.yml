name: Bug report
description: Something looks wrong, sounds wrong, crashes or does not behave as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A `/command` list or a test script (see docs/DEVELOPMENT.md) makes bugs much easier to fix.
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: UltimateCraft version
      description: Shown on the title screen and in F3.
    validations: { required: true }
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, Linux, macOS]
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: latest.log / crash.log
      description: Both files are written next to the game executable.
      render: text
